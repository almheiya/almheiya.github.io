    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

                        softblush: '#FFDBDB',
                        softblue: '#B8D4F8',

                        bubblegum: '#FF5C89',
                        bubblegumtint: '#FB8CAC',

                        chaletgreen: '#657E47',

    <style>
        /* Pink-to-Soft-Blue Gradient & Botanical Green Dot Background Pattern */
        .bg-heart-pattern {
            background-color: #FDA8BF;
            background-image: 
                radial-gradient(#FFDBDB 2.2px, transparent 2.2px), 
                radial-gradient(#6C9B76 2.2px, transparent 2.2px),
                linear-gradient(135deg, #FDA8BF 0%, #E2B8EC 55%, #B8D4F8 100%);
            background-size: 32px 32px, 32px 32px, 100% 100%;
            background-position: 0 0, 16px 16px, 0 0;
            background-attachment: fixed;
        }

        /* Washi Tape Effects with Subtle Blue Gradient on Pink Tape & Untouched Aroma Green (#97C49E) */
        .washi-tape-pink {
            background: linear-gradient(90deg, rgba(251, 140, 172, 0.92) 0%, rgba(184, 212, 248, 0.92) 100%);
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255, 255, 255, 0.45) 8px, rgba(255, 255, 255, 0.45) 16px),
                linear-gradient(90deg, rgba(251, 140, 172, 0.92) 0%, rgba(184, 212, 248, 0.92) 100%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            clip-path: polygon(0% 0%, 96% 3%, 100% 97%, 3% 100%);
        }

        .washi-tape-green {
            background: rgba(151, 196, 158, 0.92);
            background-image: repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(255, 255, 255, 0.45) 8px, rgba(255, 255, 255, 0.45) 16px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 97%);
        }

        /* Lined Notebook Paper Effect */
        .notebook-lines {
            background-color: #FFFDF9;
            background-image: linear-gradient(#FFDBDB 1px, transparent 1px);
            background-size: 100% 30px;
            line-height: 30px;
        }

        /* Smooth Scroll Roll Transition Mechanism */
        .scroll-container {
            transition: max-height 1.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease-in-out, transform 1s ease;
        }

        /* Stamp Border */
        .postage-stamp {
            border: 4px dotted #FB8CAC;
            outline: 5px solid #FFFDF9;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: linear-gradient(180deg, #FDA8BF, #B8D4F8);
        }
        ::-webkit-scrollbar-thumb {
            background: #FF5C89;
            border-radius: 4px;
        }

        /* Floating animations for background hearts */
        @keyframes heartFloat {
            0%, 100% { transform: translateY(0px) rotate(-4deg) scale(1); }
            50% { transform: translateY(-12px) rotate(8deg) scale(1.1); }
        }
        @keyframes heartPulseGlow {
            0%, 100% { opacity: 0.75; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .float-anim-1 { animation: heartFloat 3.5s ease-in-out infinite; }
