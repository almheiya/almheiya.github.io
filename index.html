<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Screen</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Consolas, monospace;
}

body{
    background:#120000;
    color:#ff1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    text-align:center;
}

.container{
    animation:flicker 1.5s infinite;
}

h1{
    font-size:4rem;
    text-shadow:0 0 10px red,0 0 20px red;
    margin-bottom:20px;
}

p{
    font-size:1.3rem;
    color:#ffb3b3;
}

.warning{
    margin-top:30px;
    color:white;
    font-size:0.9rem;
}

@keyframes flicker{
    0%,100%{opacity:1;}
    50%{opacity:.7;}
    55%{opacity:.4;}
    60%{opacity:1;}
}
</style>
</head>
<body>

<div class="container">
    <h1>YOU'VE BEEN HACKED!</h1>
    <p>Initializing system breach...</p>
    <p>Accessing secure files...</p>
    <p>Downloading confidential data...</p>

</div>

</body>
</html>
