<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Letter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;

      background:
        radial-gradient(circle at 20% 20%, #60a5fa 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #1d4ed8 0%, transparent 30%),
        linear-gradient(135deg, #0f172a, #1e40af, #2563eb, #38bdf8);

      color: #172554;
    }

    /* Floating blue circles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(147, 197, 253, 0.18);
      animation: float 8s infinite ease-in-out;
    }

    .bubble:nth-child(1) {
      width: 120px;
      height: 120px;
      left: 10%;
      top: 10%;
    }

    .bubble:nth-child(2) {
      width: 200px;
      height: 200px;
      right: 5%;
      top: 15%;
      animation-delay: 2s;
    }

    .bubble:nth-child(3) {
      width: 80px;
      height: 80px;
      left: 15%;
      bottom: 10%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    /* Main container */
    .container {
      position: relative;
      width: 90%;
      max-width: 700px;
      text-align: center;
      z-index: 2;
    }

    h1 {
      color: white;
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 10px;
      text-shadow: 0 5px 20px rgba(0, 0, 80, 0.3);
    }

    .subtitle {
      color: #dbeafe;
      margin-bottom: 40px;
      font-family: Arial, sans-serif;
    }

    /* Envelope */
    .envelope-wrapper {
      position: relative;
      width: 360px;
      height: 250px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.4s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .envelope {
      position: absolute;
      width: 100%;
      height: 180px;
      bottom: 0;
      background: #2563eb;
      border-radius: 8px;
      box-shadow: 0 25px 50px rgba(15, 23, 42, 0.4);
      overflow: hidden;
      z-index: 1;
    }

    /* Envelope front */
    .envelope::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        145deg,
        #3b82f6,
        #2563eb 55%,
        #1d4ed8
      );
      clip-path: polygon(
        0 0,
        50% 58%,
        100% 0,
        100% 100%,
        0 100%
      );
    }

    /* Letter sticking out */
    .paper {
      position: absolute;
      z-index: 2;
      width: 85%;
      height: 200px;
      left: 7.5%;
      bottom: 30px;
      background: #eff6ff;
      border-radius: 5px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      padding: 25px;
      transition: transform 0.8s ease;
    }

    .paper-lines {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        #eff6ff 0px,
        #eff6ff 27px,
        #bfdbfe 28px
      );
    }

    /* Envelope flap */
    .flap {
      position: absolute;
      z-index: 4;
      width: 100%;
      height: 140px;
      top: 70px;
      background: #60a5fa;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top;
      transition: transform 0.8s ease;
    }

    .seal {
      position: absolute;
      z-index: 5;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #1e3a8a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      left: calc(50% - 27px);
      top: 130px;
      font-size: 24px;
      box-shadow: 0 5px 15px rgba(0, 0, 50, 0.3);
      transition: opacity 0.5s ease;
    }

    .hint {
      margin-top: 30px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      opacity: 0.9;
    }

    /* Letter editor */
    .letter-editor {
      display: none;
      background: rgba(239, 246, 255, 0.96);
      border: 4px solid #60a5fa;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.45);
      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .letter-editor h2 {
      color: #1d4ed8;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .letter-editor textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      padding: 20px;
      outline: none;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.8;
      color: #172554;

      background:
        repeating-linear-gradient(
          #ffffff 0px,
          #ffffff 34px,
          #bfdbfe 35px
        );
    }

    .letter-editor textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: 0.25s;
    }

    .save {
      background: #2563eb;
      color: white;
    }

    .save:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .clear {
      background: #bfdbfe;
      color: #1e3a8a;
    }

    .clear:hover {
      background: #93c5fd;
    }

    .close {
      background: #dbeafe;
      color: #1e40af;
    }

    .close:hover {
      background: #bfdbfe;
    }

    .saved-message {
      margin-top: 15px;
      color: #2563eb;
      font-family: Arial, sans-serif;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .saved-message.show {
      opacity: 1;
    }

    /* Open animation */
    .open .flap {
      transform: rotateX(180deg);
    }

    .open .paper {
      transform: translateY(-120px);
    }

    .open .seal {
      opacity: 0;
    }

    @media (max-width: 500px) {
      .envelope-wrapper {
        width: 300px;
        height: 220px;
      }

      .envelope {
        height: 150px;
      }

      .paper {
        height: 170px;
      }

      .flap {
        top: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <main class="container">

    <!-- Opening screen -->
    <section id="opening">

      <h1>A Letter For You 💙</h1>
      <p class="subtitle">Click the envelope to open it</p>

      <div class="envelope-wrapper" id="envelopeWrapper">

        <div class="paper">
          <div class="paper-lines"></div>
        </div>

        <div class="envelope"></div>

        <div class="flap"></div>

        <div class="seal">✉</div>

      </div>

      <p class="hint">Click the blue envelope</p>

    </section>

    <!-- Letter editor -->
    <section class="letter-editor" id="letterEditor">

      <h2>💌 Write Your Letter</h2>

      <textarea
        id="letterText"
        placeholder="Dear someone special,

Write your words here...

You can write anything you'd like. 💙

With love,"
      ></textarea>

      <div class="buttons">

        <button class="save" onclick="saveLetter()">
          Save Letter
        </button>

        <button class="clear" onclick="clearLetter()">
          Clear
        </button>

        <button class="close" onclick="closeLetter()">
          Close
        </button>

      </div>

      <p class="saved-message" id="savedMessage">
        ✓ Your letter has been saved!
      </p>

    </section>

  </main>

  <script>

    const envelope = document.getElementById("envelopeWrapper");
    const opening = document.getElementById("opening");
    const editor = document.getElementById("letterEditor");
    const textarea = document.getElementById("letterText");
    const savedMessage = document.getElementById("savedMessage");

    /* Open envelope */
    envelope.addEventListener("click", () => {

      envelope.classList.add("open");

      setTimeout(() => {

        opening.style.display = "none";
        editor.style.display = "block";

        textarea.focus();

      }, 900);

    });

    /* Save letter */
    function saveLetter() {

      const text = textarea.value;

      localStorage.setItem("myBlueLetter", text);

      savedMessage.classList.add("show");

      setTimeout(() => {
        savedMessage.classList.remove("show");
      }, 2500);

    }

    /* Clear letter */
    function clearLetter() {

      textarea.value = "";

      localStorage.removeItem("myBlueLetter");

    }

    /* Close letter */
    function closeLetter() {

      editor.style.display = "none";
      opening.style.display = "block";

      envelope.classList.remove("open");

    }

    /* Load previously saved letter */
    window.addEventListener("load", () => {

      const saved = localStorage.getItem("myBlueLetter");

      if (saved) {
        textarea.value = saved;
      }

    });

  </script>

</body>
</html>
